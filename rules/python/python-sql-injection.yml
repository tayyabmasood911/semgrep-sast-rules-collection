rules:
  - id: python-sql-injection-raw-format
    languages: [python]
    severity: ERROR
    message: "Raw string interpolation detected in SQL statement execution. Use parameterized queries or ORM placeholders."
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: security
    pattern-either:
      - pattern: $CURSOR.execute(f"...{$VAR}...")
      - pattern: $CURSOR.execute("..." % ($VAR))
      - pattern: $CURSOR.execute("...".format($VAR))
      - pattern: $CURSOR.execute("..." + $VAR)
