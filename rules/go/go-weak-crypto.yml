rules:
  - id: go-weak-cryptographic-hash
    languages: [go]
    severity: WARNING
    message: "Broken or collision-vulnerable cryptographic hash algorithm detected (MD5 or SHA1). Upgrade to SHA-256 or bcrypt."
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
