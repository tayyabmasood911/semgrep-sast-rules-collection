rules:
  - id: go-sql-injection-concat
    languages: [go]
    severity: ERROR
    message: "Dynamic string construction detected in database query. Use prepared statements with query arguments."
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: security
    pattern-either:
      - pattern: $DB.Query(fmt.Sprintf("...", ...))
      - pattern: $DB.Exec(fmt.Sprintf("...", ...))
      - pattern: $DB.QueryRow(fmt.Sprintf("...", ...))
      - pattern: $DB.Query("..." + $INPUT)
