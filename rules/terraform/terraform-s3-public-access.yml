rules:
  - id: terraform-s3-missing-public-access-block
    languages: [hcl, terraform]
    severity: ERROR
    message: "AWS S3 bucket resource declared without an associated aws_s3_bucket_public_access_block. This may lead to accidental public disclosure."
    metadata:
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      owasp: "A01:2021 - Broken Access Control"
      category: security
      technology:
        - terraform
        - aws
    patterns:
      - pattern-inside: |
          resource "aws_s3_bucket" "$BUCKET" {
            ...
          }
      - pattern-not-inside: |
          resource "aws_s3_bucket_public_access_block" "..." {
            bucket = aws_s3_bucket.$BUCKET.id
            block_public_acls = true
            block_public_policy = true
            ignore_public_acls = true
            restrict_public_buckets = true
            ...
          }
