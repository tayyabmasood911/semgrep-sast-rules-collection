rules:
  - id: ci-secrets-hardcoded-aws-access-key
    languages: [generic]
    severity: ERROR
    message: "Hardcoded AWS Access Key ID pattern detected. Rotate this credential immediately and migrate to IAM roles."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
    patterns:
      - pattern-regex: "(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"

  - id: ci-secrets-hardcoded-github-token
    languages: [generic]
    severity: ERROR
    message: "Hardcoded GitHub Personal Access Token detected. Store sensitive tokens in GitHub Secrets."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
    patterns:
      - pattern-regex: "gh[pousr]_[0-9a-zA-Z]{36}"

  - id: ci-secrets-hardcoded-private-key
    languages: [generic]
    severity: ERROR
    message: "Unencrypted cryptographic private key block detected in repository."
    metadata:
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
    patterns:
      - pattern-regex: "-----BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY-----"
