rules:
  - id: jwt-hardcoded-secret-key
    languages: [javascript, typescript, python, go]
    severity: ERROR
    message: "Hardcoded JWT secret detected. JWT signing secrets must be loaded from secure environment variables or vault."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
    pattern-either:
      - pattern: jwt.sign(..., "...", ...)
      - pattern: jwt.verify(..., "...", ...)
      - pattern: jwt.encode(..., "...", ...)
      - pattern: jwt.decode(..., "...", ...)
